[General]
; Oxygen units spent for each point of boost fuel actually restored.
; At 1.0, 25 points restored costs 25 points of currently remaining O2.
fO2PerFuel=1.0

; Keep the boostpack from spending the player's last O2 on fuel recharge.
; Recharge pauses at this percentage of live maximum O2 capacity.
; Any finite value at or below 0 disables the safeguard; values above 100
; are clamped to 100.
fMinimumO2ReservePercent=20.0

; Recharge is free in sealed interiors and truly breathable atmospheres.
; CO2, H2, methane, nitrogen, and vacuum still require stored O2.
bFreeInSealedOrBreathable=1

; Prevent boosting whenever vanilla says the player's spacesuit is hidden.
; Compatible with bUsePressAndHoldControls=1.
bDisableBoostWhenSuitHidden=1

; Logs at most 120 recharge transactions. Enable only for troubleshooting.
bDebugLogging=0
